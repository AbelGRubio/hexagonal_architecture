# ==============================================================================
# Global Event-Driven Architecture Configuration
# ==============================================================================

# 1. Global default configuration for ALL threads in the file
default: rabbitmq

broker_config:
  - broker_type: rabbitmq

  - broker_type: kafka
    broker_kwargs:
      bootstrap_servers: ["kafka-broker:9092"]
      group_id: default-group

# 2. List of thread configurations
threads:
  # Thread 1: Synthetic cart items producer
  - name: producer
    producer:
      topicOrQueue: cart-items
      exchange: cart-exchange
    error:
      topicOrQueue: cart-items-dlq

  # Thread 2: Inventory consumer processing carts
  - name: inventory
    consumer:
      topicOrQueue: cart-items
      exchange: cart-exchange
    producer:
      topicOrQueue: inventory-reserved
      exchange: inventory-exchange
    error:
      topicOrQueue: inventory-dlq

  # Thread 3: Order management processing reserved inventory
  - name: order
    consumer:
      topicOrQueue: inventory-reserved
      exchange: inventory-exchange
    producer:
      topicOrQueue: payment
      exchange: payment-exchange
    error:
      topicOrQueue: payment-dlq

  # Thread 4: Payment processing (receives order/payment, publishes notification event)
  - name: payment
    consumer:
      topicOrQueue: payment
      exchange: payment-exchange
    producer:
      topicOrQueue: notification
      exchange: notification-exchange
    error:
      topicOrQueue: payment-dlq

  # Thread 5: User notification (final step of the flow)
  - name: notification
    consumer:
      topicOrQueue: notification
      exchange: notification-exchange
    error:
      topicOrQueue: notification-dlq