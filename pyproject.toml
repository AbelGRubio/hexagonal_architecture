[project]
name = "event_driven_architecture"
version = "0.1.0"
description = "An example of event_driven system with hexagonal architecture"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "agrubio", email = "a.grubio@hotmail.com" },
]
requires-python = ">=3.13"
keywords = [
    "python", "system modeller", "migrations", "yaml"
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "typer<0.24",
    "orjson>=3.11.9",
    "psutil>=7.0.0",
    "py-cpuinfo>=9.0.0",
    "confluent-kafka>=2.3.0",
    "pika>=1.4.4",
    "starlette>=1.6.0",
    "peewee>=4.3.0",
    "pyyaml",
    "tenacity>=9.1.4",
    "redis>=8.1.0",
    "pybreaker>=1.4.1",
]


[dependency-groups]
docker = [
    "aws-opentelemetry-distro>=0.10.1",
    "opentelemetry-exporter-otlp>=1.25,<2",
    "opentelemetry-sdk",
]

test = [
    "peewee",
    "boto3>=1.34,<2",
    "botocore",
    "tabulate"
]

dev = [
    "pre-commit>=4.5.1",
    "pyrefly>=0.53.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cookies>=0.7.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.1",
    "ty>=0.0.17",
    "python-semantic-release==10.5.3",
    "twine",
    "pymodeller>=0.9.2"
]

docs = [
    "mkdocs==1.6.1",
    "mkdocs-material>=9.7.2",
    "mkdocstrings>=1.0.3",
    "mkdocstrings-python>=2.0.2",
    "typing-extensions>=4.15.0",
    "mkdocs-awesome-pages-plugin==2.9.3",
    "pymdown-extensions>=10.21.2",
]

[tool.pymodeller]
base_dir = "./src/event_driven"

# Archivos de entrada/configuración global
models_yaml = "./pymodeller/pymodeller.yaml"
exceptions_yaml = "./pymodeller/exceptions.yaml"
environment_file = "./environments.yaml"
generate_init_models = true
enabled_sources = "yaml"

# Destinos según el 'model_type'
[tool.pymodeller.destinations.infrastructure]
# import_settings_base_class="from config_das.models.base_settings import BaseTraceableSettings
pydantic_model_folder = "config/schemas"
pydantic_settings_folder = "config/settings"
pydantic_settings_init = "config/init_settings.py"

peewee_folder = "persistence/models"
peewee_out = "persistence/connection.py"

exceptions_folder = "exceptions"
enumerations_folder = "config/enumerations"

[tool.pymodeller.destinations.domain]
import_settings_base_class="from event_driven.infrastructure.config.settings.base_settings import BaseTraceableSettings"

pydantic_model_folder = "schemas"
pydantic_settings_folder = "settings"
pydantic_settings_init = "init_settings.py"

peewee_folder = "persistence/models"
peewee_out = "persistence/connection.py"

exceptions_folder = "exceptions"
enumerations_folder = "enumerations"


[tool.ruff]
preview = true
target-version = "py313"
line-length = 120
indent-width = 4
extend-exclude = [".venv", "build", "dist", "notebooks_extra", "tests"] # tests


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"


[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PGH", # pygrep-hooks
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "YTT", # flake8-2020
]
ignore = ["ANN401", "D205"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.isort]
known-first-party = ["event_driven"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]


[tool.ruff.lint.per-file-ignores]
"**/notebooks_extra/**" = ["ALL"]
"**/src/__main__.py" = ["ALL"]
"**.ipynb" = ["E501", "D100", "D103", "D101", "E402", "I002", "T201"]
"**/__init__.py" = ["D104", "F401"]
"tests/**" = ["S101", "D103", "D100", "D104", "SLF001", "B018"]


[tool.ty.rules]


[tool.ty.environment]
python = "./.venv"
python-version = "3.13"
python-platform = "linux"
root = ["."]
extra-paths = []


[tool.ty.src]
respect-ignore-files = false
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/*venv/**/*", "./build", "src/__main__.py"]


[tool.pyrefly]
use-ignore-files = false
project-includes = ["src"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
    "**/tests",
]
search-path = [
    "src",
    ".venv/lib/python3.13/site-packages",
]
python-platform = "linux"
python-version = "3.13"
python-interpreter-path = ".venv/bin/python3"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    "src",
]
addopts = [
    "-n",
    "auto",
    "--cov=src/event_driven",
    "--cov-report=xml",
    "--cov-report=json",
    "--cov-report=html",
    "--cov-report=term-missing",
]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
python_files = "test_*.py tests_*.py *_test.py"
python_classes = "*Test Test* Describe*"
python_functions = "test_* it_* should_* scenario_*"

[tool.coverage.run]
omit = [
    "*.yaml",
    "**/*.yaml",
    "**/__pycache__/**",
    "**/__init__.py"
]


[tool.semantic_release]
build_command = "uv build"
allow_zero_version = true
tag_format = "v{version}"
version_variables = [
    "pyproject.toml:version",
    "src/event_driven/__init__.py:__version__"
]

[tool.semantic_release.changelog]
default_templates.changelog_file = "docs/CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.feature]
match = "^feature/.*$"
prerelease = true
prerelease_token = "rc"

[tool.hatch.build.targets.wheel]
packages = ["src/event_driven"]
include = [
    "src/event_driven/infrastructure/config/threads.yaml"
]

[tool.hatch.build]
artifacts = ["src/event_driven/infrastructure/config/threads.yaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# Add executable scripts
[project.scripts]
event-driven = "event_driven.infrastructure.cli.cli:app"


[tool.uv.sources]
pymodeller = { path = "../pymodeller", editable = true }
