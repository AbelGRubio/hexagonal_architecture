# ==============================================================================
# Global Event-Driven Architecture Configuration
# ==============================================================================

# 1. Configuración global por defecto para TODOS los hilos del archivo
default: rabbitmq

broker_config:
  - broker_type: rabbitmq
    broker_kwargs:
      host: localhost
      port: 5672

  - broker_type: kafka
    broker_kwargs:
      bootstrap_servers: ["kafka-broker:9092"]
      group_id: default-group

# 2. Lista de configuraciones de hilos
threads:
  # Thread 1: Productor sintético de ítems de carrito
  - name: producer
    producer:
      topicOrQueue: cart-items
      exchange: cart-exchange
    error:
      topicOrQueue: cart-items-dlq

  # Thread 2: Consumidor de inventario que procesa carritos
  - name: inventory
    consumer:
      topicOrQueue: cart-items
      exchange: cart-exchange
    producer:
      topicOrQueue: inventory-reserved
      exchange: inventory-exchange
    error:
      topicOrQueue: inventory-dlq

  - name: order
    consumer:
      topicOrQueue: inventory-reserved
      exchange: inventory-exchange
    producer:
      topicOrQueue: payment
      exchange: payment-exchange
    error:
      topicOrQueue: payment-dlq

  # Thread 4: Procesamiento del pago (recibe orden/pago, publica evento de notificación)
  - name: payment
    consumer:
      topicOrQueue: payment
      exchange: payment-exchange
    producer:
      topicOrQueue: notification
      exchange: notification-exchange
    error:
      topicOrQueue: payment-dlq

  # Thread 5: Notificación al usuario (paso final del flujo)
  - name: notification
    consumer:
      topicOrQueue: notification
      exchange: notification-exchange
    error:
      topicOrQueue: notification-dlq